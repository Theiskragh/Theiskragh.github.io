name: Update Papers from Google Scholar

on:
  schedule:
    # Run every Sunday at 02:00 UTC (conservative: once per week)
    - cron: "0 2 * * 0"
  workflow_dispatch:   # Allow manual trigger from the Actions tab

permissions:
  contents: write      # Needed to commit updated papers.json back to the repo

jobs:
  update-papers:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Fetch the branch we want to commit back to
          ref: ${{ github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Fetch papers from Google Scholar
        env:
          SCHOLAR_ID: "IfJBsd0AAAAJ"
        run: python scripts/fetch_scholar.py --scholar-id "$SCHOLAR_ID" --output data/papers.json
        # If the script exits non-zero (Scholar blocked, network error, etc.),
        # the step fails but we continue so the site keeps serving cached data.
        continue-on-error: true

      - name: Check for changes
        id: changes
        run: |
          git diff --quiet data/papers.json && echo "changed=false" >> "$GITHUB_OUTPUT" || echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Commit and push updated papers.json
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/papers.json
          git commit -m "chore: update papers.json from Google Scholar [skip ci]"
          git push
